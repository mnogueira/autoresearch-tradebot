[project]
name = "autoresearch-tradebot"
version = "0.1.0"
description = "Autonomous AI agent research loop for WDO (mini dollar) day trading strategies"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=14.0",
    "ta>=0.11",
]

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.45"]
analysis = ["matplotlib>=3.8", "tabulate>=0.9"]
all = ["autoresearch-tradebot[mt5,analysis]"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.3"]

[tool.ruff]
line-length = 100
